<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050000">
<title>I LOVE YOU ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root { --red:#FF0000; --dark:#8B0000; --black:#050000; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--black); font-family:'Montserrat','Arial Black','Segoe UI',sans-serif; }
  body { background:radial-gradient(ellipse at 50% 46%, #3a0000 0%, #1c0000 36%, #050000 78%); }

  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #fx { z-index:1; }
  #heart { z-index:2; }
  .vignette { position:fixed; inset:0; z-index:5; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.78) 100%); }

  /* ---------- intro ---------- */
  #intro { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(18px,3.5vh,34px); text-align:center; padding:24px; transition:opacity .9s ease, visibility .9s; }
  #intro.hide { opacity:0; visibility:hidden; pointer-events:none; }
  .title { font-weight:900; font-size:clamp(44px,12vw,132px); line-height:1; letter-spacing:.04em; color:var(--red);
    text-shadow:0 0 10px #f00, 0 0 28px #f00, 0 0 70px var(--dark), 0 0 120px var(--dark);
    animation:titleBeat 1.25s ease-in-out infinite; }
  .sub { font-weight:800; font-size:clamp(11px,2.6vw,16px); letter-spacing:.38em; color:#b30000; text-transform:uppercase;
    text-shadow:0 0 12px rgba(255,0,0,.55); }
  @keyframes titleBeat { 0%,100%{ transform:scale(1);} 14%{ transform:scale(1.045);} 28%{ transform:scale(1);} 40%{ transform:scale(1.03);} 55%{ transform:scale(1);} }

  /* ---------- buttons ---------- */
  .btn { font:800 13px 'Montserrat','Arial Black',sans-serif; letter-spacing:.14em; color:#ff1a1a; background:rgba(22,0,0,.78);
    border:1.5px solid var(--red); border-radius:999px; padding:13px 22px; cursor:pointer; text-shadow:0 0 8px #f00;
    box-shadow:0 0 14px rgba(255,0,0,.45), inset 0 0 12px rgba(139,0,0,.55);
    transition:transform .15s ease, box-shadow .2s ease, background .2s ease, color .2s ease; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .btn:hover { background:var(--dark); color:#fff; box-shadow:0 0 26px rgba(255,0,0,.8), inset 0 0 12px rgba(255,0,0,.4); }
  .btn:active { transform:scale(.95); }
  .btn.primary { font-size:clamp(17px,4.6vw,24px); padding:17px 48px; color:#fff; border-color:#ff2a2a;
    background:linear-gradient(180deg,#ff0000 0%,#8B0000 100%); text-shadow:0 0 10px rgba(0,0,0,.6);
    box-shadow:0 0 28px rgba(255,0,0,.85), 0 0 70px rgba(255,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25);
    animation:btnBeat 1.25s ease-in-out infinite; }
  @keyframes btnBeat { 0%,100%{ transform:scale(1);} 14%{ transform:scale(1.06);} 28%{ transform:scale(1);} 40%{ transform:scale(1.04);} 55%{ transform:scale(1);} }

  #controls { position:fixed; left:0; right:0; bottom:max(16px, env(safe-area-inset-bottom)); z-index:12;
    display:flex; justify-content:center; gap:12px; padding:0 12px; flex-wrap:nowrap; }
  .hidden { display:none !important; }
  @media (max-width:420px){ .btn { padding:12px 16px; font-size:12px; letter-spacing:.1em; } }
</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <canvas id="heart"></canvas>
  <div class="vignette"></div>

  <div id="intro">
    <div class="title">I LOVE YOU</div>
    <div class="sub">Ribuan kata &middot; satu perasaan</div>
    <button class="btn primary" id="startBtn" type="button">MULAI ❤️</button>
  </div>

  <div id="controls">
    <button class="btn hidden" id="replayBtn" type="button">ULANGI</button>
    <button class="btn" id="musicBtn" type="button" aria-pressed="true">♪ MUSIK: ON</button>
  </div>

  <audio id="bgm" src="typeku.mp3" loop preload="auto"></audio>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const hc = $('heart'), hx = hc.getContext('2d');
  const fc = $('fx'),    fx = fc.getContext('2d');
  const intro = $('intro'), startBtn = $('startBtn'), replayBtn = $('replayBtn'), musicBtn = $('musicBtn'), bgm = $('bgm');

  const TEXT = 'I LOVE YOU';
  const COLORS = [
    { fill:'#FF0000', glow:'#FF0000', blur:1.00 },  // merah menyala
    { fill:'#FF2A2A', glow:'#FF0000', blur:0.90 },  // merah terang
    { fill:'#D40000', glow:'#FF0000', blur:0.65 },  // merah
    { fill:'#8B0000', glow:'#B00000', blur:0.40 }   // merah tua
  ];

  /* ---------- bentuk hati (persamaan implisit) ---------- */
  const inside = (x, y) => { const a = x*x + y*y - 1; return a*a*a - x*x*y*y*y <= 0; };
  let bx0 = 9, bx1 = -9, by0 = 9, by1 = -9;
  for (let x = -1.6; x <= 1.6; x += 0.004)
    for (let y = -1.6; y <= 1.6; y += 0.004)
      if (inside(x, y)) { if (x<bx0) bx0=x; if (x>bx1) bx1=x; if (y<by0) by0=y; if (y>by1) by1=y; }
  const bw = bx1 - bx0, bh = by1 - by0;

  /* ---------- state ---------- */
  let W = 0, H = 0, DPR = 1;
  let L = {};                 // layout
  let words = [], sprites = [];
  let fs = 10, ww = 60, pad = 10, sw = 0, sh = 0, fontStr = '';
  let state = 'idle';         // idle | build | beat
  let t0 = 0, endAt = 0, staticCv = null;
  let started = false, musicOn = true, ready = false;

  const letterSp = s => (s * 0.05) + 'px';
  function applyFont(g) { g.font = fontStr; if ('letterSpacing' in g) g.letterSpacing = letterSp(fs); }

  /* ---------- layout: susun kata mengikuti siluet hati ---------- */
  function buildLayout() {
    W = innerWidth; H = innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 3);
    [hc, fc].forEach(c => { c.width = Math.round(W*DPR); c.height = Math.round(H*DPR); });

    const phone = W < 700;
    const bottomR = phone ? 88 : 96, topR = phone ? 14 : 22, sideR = phone ? 8 : 24;
    const aw = W - sideR*2, ah = H - topR - bottomR;
    const sx0 = aw / bw, sy0 = ah / bh;
    const sy = Math.min(sy0, sx0 * (phone ? 1.6 : 1.3));
    const sx = Math.min(sx0, sy / 0.85);
    const hw = bw * sx, hh = bh * sy;
    const left = (W - hw) / 2, top = topR + (ah - hh) / 2;
    L = { sx, sy, hw, hh, left, top, cx: W/2, cy: top + hh/2 };

    fs = Math.max(phone ? 6.6 : 6.4, hh / (phone ? 100 : 125));
    fontStr = `800 ${fs}px Montserrat, "Arial Black", "Segoe UI", Arial, sans-serif`;
    applyFont(hx);
    ww = Math.ceil(hx.measureText(TEXT).width);
    pad = Math.ceil(fs * 1.1);
    sw = ww + pad*2; sh = fs + pad*2;

    // sprite berpendar (glow) per warna
    sprites = COLORS.map(c => {
      const s = document.createElement('canvas');
      s.width = Math.ceil(sw*DPR); s.height = Math.ceil(sh*DPR);
      const g = s.getContext('2d');
      g.scale(DPR, DPR); applyFont(g);
      g.textBaseline = 'middle'; g.textAlign = 'left'; g.fillStyle = c.fill;
      g.shadowColor = c.glow;
      g.shadowBlur = fs*0.95*c.blur*DPR; g.fillText(TEXT, pad, pad + fs/2);
      g.shadowBlur = fs*0.35*c.blur*DPR; g.fillText(TEXT, pad, pad + fs/2);
      g.shadowBlur = 0;                  g.fillText(TEXT, pad, pad + fs/2);
      return s;
    });

    const toN = (px, py) => [bx0 + (px - left)/sx, by1 - (py - top)/sy];
    const ins = (px, py) => { const [nx, ny] = toN(px, py); return inside(nx, ny); };

    const rowH = fs * 1.2;
    const rows = Math.floor(hh / rowH);
    const y0 = top + (hh - rows*rowH)/2 + rowH/2;
    const minGap = fs * 0.55, maxGap = fs * 1.7;
    words = [];

    for (let r = 0; r < rows; r++) {
      const cy = y0 + r*rowH;
      const segs = []; let a = null;
      for (let px = left; px <= left + hw; px += 1) {
        const ok = ins(px, cy) && ins(px, cy - fs*0.5) && ins(px, cy + fs*0.5);
        if (ok && a === null) a = px;
        if ((!ok || px + 1 > left + hw) && a !== null) { segs.push([a, px]); a = null; }
      }
      for (const [sa, sb] of segs) {
        const len = sb - sa;
        const n = Math.floor((len + minGap) / (ww + minGap));
        if (n < 1) continue;
        let gap = n > 1 ? (len - n*ww) / (n - 1) : 0;
        let startX = sa;
        if (n === 1) startX = sa + (len - ww)/2;
        else if (gap > maxGap) { gap = minGap; startX = sa + (len - (n*ww + (n-1)*gap))/2; }
        for (let i = 0; i < n; i++) {
          const x = startX + i*(ww + gap);
          const edge = (i === 0 || i === n-1);
          const d = Math.min(1, Math.hypot((x + ww/2 - L.cx)/(hw/2), (cy - L.cy)/(hh/2)));
          const rnd = Math.random();
          let idx;
          if (edge) idx = rnd < 0.7 ? 0 : 1;               // tepi lebih terang → siluet hati tegas
          else {
            const p0 = 0.32 - 0.12*d, p1 = p0 + 0.30, p2 = p1 + 0.22;
            idx = rnd < p0 ? 0 : rnd < p1 ? 1 : rnd < p2 ? 2 : 3;
          }
          words.push({ x, y: cy, c: idx, ox:0, oy:0, rot:0, delay:0, dur:900 });
        }
      }
    }
  }

  /* ---------- animasi masuk dari berbagai arah ---------- */
  function randomize() {
    const N = words.length;
    const order = Array.from({length:N}, (_, i) => i);
    for (let i = N-1; i > 0; i--) { const j = (Math.random()*(i+1))|0; [order[i], order[j]] = [order[j], order[i]]; }
    const total = Math.max(6000, Math.min(9500, N * 8));
    let maxEnd = 0;
    order.forEach((wi, k) => {
      const w = words[wi];
      const ang = Math.random() * Math.PI * 2;
      const dist = Math.max(W, H) * (0.45 + Math.random()*0.65);
      w.ox = Math.cos(ang) * dist; w.oy = Math.sin(ang) * dist;
      w.rot = (Math.random() - 0.5) * Math.PI * 1.8;
      w.dur = 800 + Math.random()*700;
      w.delay = (k / N) * total + Math.random()*120;
      maxEnd = Math.max(maxEnd, w.delay + w.dur);
    });
    endAt = maxEnd + 150;
  }

  function startAnim() {
    if (!ready) return;
    randomize();
    staticCv = null;
    t0 = performance.now() + 350;
    state = 'build';
  }

  function makeStatic() {
    staticCv = document.createElement('canvas');
    staticCv.width = hc.width; staticCv.height = hc.height;
    const g = staticCv.getContext('2d');
    g.scale(DPR, DPR);
    for (const w of words) g.drawImage(sprites[w.c], w.x - pad, w.y - fs/2 - pad, sw, sh);
  }

  /* ---------- detak jantung (lub-dub lembut) ---------- */
  const gauss = (x, c, s) => Math.exp(-Math.pow((x - c)/s, 2));
  const pulse = sec => { const ph = sec % 1.25; return Math.min(1, gauss(ph, 0.12, 0.07) + 0.7*gauss(ph, 0.38, 0.08)); };

  /* ---------- partikel hati merah kecil ---------- */
  const pSprites = [];
  function makePSprites() {
    pSprites.length = 0;
    ['#FF0000', '#B30000', '#FF1A1A'].forEach(col => {
      const s = document.createElement('canvas'); const S = 48;
      s.width = s.height = S * 2;
      const g = s.getContext('2d'); g.scale(2, 2);
      g.translate(S/2, S/2 - 12);
      g.fillStyle = col; g.shadowColor = '#FF0000'; g.shadowBlur = 12;
      heartPath(g, 34); g.fill();
      pSprites.push(s);
    });
  }
  function heartPath(c, s) {
    c.beginPath();
    c.moveTo(0, s*0.25);
    c.bezierCurveTo(0, -s*0.15, -s*0.6, -s*0.15, -s*0.6, s*0.2);
    c.bezierCurveTo(-s*0.6, s*0.55, -s*0.1, s*0.7, 0, s*0.95);
    c.bezierCurveTo(s*0.1, s*0.7, s*0.6, s*0.55, s*0.6, s*0.2);
    c.bezierCurveTo(s*0.6, -s*0.15, 0, -s*0.15, 0, s*0.25);
    c.closePath();
  }
  let parts = [];
  function spawnPart(burst) {
    const size = 7 + Math.random()*14;
    const p = { s:size, spr:(Math.random()*pSprites.length)|0, ph:Math.random()*6.28, sway:6 + Math.random()*16,
      a:0.18 + Math.random()*0.5, life:1, burst:false };
    if (burst) {
      const ang = Math.random()*Math.PI*2, sp = 120 + Math.random()*320;
      Object.assign(p, { x:L.cx, y:L.cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, burst:true, life:1, a:0.9 });
    } else {
      Object.assign(p, { x:Math.random()*W, y:Math.random()*H, vx:0, vy:-(14 + Math.random()*34) });
    }
    return p;
  }
  function initParts() { parts = []; const n = W < 700 ? 26 : 46; for (let i = 0; i < n; i++) parts.push(spawnPart(false)); }

  /* ---------- render ---------- */
  let lastT = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (!ready) return;

    // --- partikel (di belakang tulisan)
    fx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (p.burst) {
        p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.985; p.vy *= 0.985; p.vy -= 10*dt; p.life -= dt*0.45;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
      } else {
        p.y += p.vy*dt; p.ph += dt*1.2; p.x += Math.sin(p.ph)*p.sway*dt;
        if (p.y < -30) { p.y = H + 30; p.x = Math.random()*W; }
      }
      fx.globalAlpha = p.a * (p.burst ? Math.max(0, p.life) : 1);
      fx.drawImage(pSprites[p.spr], p.x - p.s/2, p.y - p.s/2, p.s, p.s);
    }
    fx.globalAlpha = 1;

    if (state === 'idle') { hx.setTransform(1,0,0,1,0,0); hx.clearRect(0, 0, hc.width, hc.height); return; }

    const t = now - t0;
    const sec = now / 1000;
    const prog = state === 'beat' ? 1 : Math.max(0, Math.min(1, t / endAt));
    const pl = pulse(sec) * Math.min(1, prog * 1.4);
    const sc = 1 + 0.03 * pl;

    hx.setTransform(1,0,0,1,0,0);
    hx.clearRect(0, 0, hc.width, hc.height);
    hx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // cahaya merah di belakang hati
    const R = L.hw * 0.75;
    const gr = hx.createRadialGradient(L.cx, L.cy, 0, L.cx, L.cy, R);
    const ga = (0.10 + 0.20*pl) * (0.35 + 0.65*prog);
    gr.addColorStop(0, `rgba(255,0,0,${ga})`); gr.addColorStop(0.55, `rgba(139,0,0,${ga*0.5})`); gr.addColorStop(1, 'rgba(139,0,0,0)');
    hx.fillStyle = gr; hx.fillRect(0, 0, W, H);

    // denyut jantung + sedikit zoom sinematik saat membangun
    const zoom = state === 'build' ? 1.05 - 0.05*prog : 1;
    hx.translate(L.cx, L.cy); hx.scale(sc*zoom, sc*zoom); hx.translate(-L.cx, -L.cy);

    if (state === 'build') {
      let done = 0;
      for (const w of words) {
        let p = (t - w.delay) / w.dur;
        if (p <= 0) continue;
        if (p >= 1) { done++; hx.drawImage(sprites[w.c], w.x - pad, w.y - fs/2 - pad, sw, sh); continue; }
        const e = 1 - Math.pow(1 - p, 3), k = 1 - e;
        hx.save();
        hx.globalAlpha = Math.min(1, p * 2.4);
        hx.translate(w.x + ww/2 + w.ox*k, w.y + w.oy*k);
        hx.rotate(w.rot * k);
        const s = 0.35 + 0.65*e; hx.scale(s, s);
        hx.drawImage(sprites[w.c], -ww/2 - pad, -fs/2 - pad, sw, sh);
        hx.restore();
      }
      if (t >= endAt) {
        makeStatic(); state = 'beat';
        for (let i = 0; i < (W < 700 ? 36 : 60); i++) parts.push(spawnPart(true));
      }
    } else {
      hx.drawImage(staticCv, 0, 0, W, H);
      if (pl > 0.02) {
        hx.globalCompositeOperation = 'lighter';
        hx.globalAlpha = 0.38 * pl;
        hx.drawImage(staticCv, 0, 0, W, H);
        hx.globalAlpha = 1; hx.globalCompositeOperation = 'source-over';
      }
    }
  }

  /* ---------- musik ---------- */
  function setMusicLabel() {
    musicBtn.textContent = '♪ MUSIK: ' + (musicOn ? 'ON' : 'OFF');
    musicBtn.setAttribute('aria-pressed', String(musicOn));
  }
  function tryPlay() {
    if (!musicOn) return;
    const pr = bgm.play();
    if (pr && pr.catch) pr.catch(() => { musicOn = false; setMusicLabel(); });
  }
  musicBtn.addEventListener('click', () => {
    musicOn = !musicOn; setMusicLabel();
    if (started) { musicOn ? tryPlay() : bgm.pause(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (!started) return;
    if (document.hidden) bgm.pause(); else if (musicOn) tryPlay();
  });
  bgm.volume = 0.85;

  /* ---------- tombol ---------- */
  startBtn.addEventListener('click', () => {
    started = true;
    intro.classList.add('hide');
    replayBtn.classList.remove('hidden');
    tryPlay();
    startAnim();
  });
  replayBtn.addEventListener('click', () => { startAnim(); });

  /* ---------- resize ---------- */
  let rzT = 0, lastW = 0, lastH = 0;
  addEventListener('resize', () => {
    clearTimeout(rzT);
    rzT = setTimeout(() => {
      if (innerWidth === lastW && innerHeight === lastH) return;
      lastW = innerWidth; lastH = innerHeight;
      const prev = state;
      buildLayout(); initParts();
      if (prev === 'build') startAnim();
      else if (prev === 'beat') { randomize(); makeStatic(); state = 'beat'; }
    }, 220);
  });

  /* ---------- init ---------- */
  const fontReady = Promise.race([
    (document.fonts && document.fonts.load) ? document.fonts.load('800 20px Montserrat') : Promise.resolve(),
    new Promise(r => setTimeout(r, 1800))
  ]).catch(() => {});
  fontReady.then(() => {
    lastW = innerWidth; lastH = innerHeight;
    makePSprites(); buildLayout(); initParts(); ready = true;
    if (started) startAnim();
    window.__heart = { get words() { return words.length; }, get state() { return state; } };
  });
  setMusicLabel();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
